<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report Delivery Reliability | Meridian Payments</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", sans-serif;
            color: #1e293b;
            background: #f4f7fb;
        }
        body { margin: 0; }
        header { background: #10243a; color: white; padding: 24px max(24px, calc((100% - 1180px) / 2)); }
        header h1 { margin: 0 0 6px; font-size: 24px; }
        header p { margin: 0; color: #c4d2e2; }
        main { max-width: 1180px; margin: 28px auto; padding: 0 20px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
        .card, .panel { background: white; border: 1px solid #e2e8f0; border-radius: 10px; }
        .card { padding: 18px; }
        .card span { display: block; color: #64748b; font-size: 13px; }
        .card strong { display: block; margin-top: 8px; font-size: 28px; }
        .panel { margin-top: 24px; overflow: hidden; }
        .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #e2e8f0; }
        h2 { margin: 0; font-size: 18px; }
        .panel-heading p { margin: 5px 0 0; color: #64748b; font-size: 13px; }
        button { border: 0; background: #eaf1f8; color: #173b5e; padding: 9px 12px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #d8e6f3; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 13px 16px; border-bottom: 1px solid #edf1f5; white-space: nowrap; }
        th { color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
        tr:last-child td { border-bottom: 0; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .RETRY_RECOMMENDED { background: #fff4d6; color: #875b00; }
        .UNRESOLVED { background: #fee2e2; color: #991b1b; }
        .REVIEW_REQUIRED { background: #e2e8f0; color: #334155; }
        .SUCCEEDED { background: #dcfce7; color: #166534; }
        .reason { color: #475569; white-space: normal; min-width: 290px; }
        .error { margin: 18px 0; padding: 12px 14px; border-radius: 6px; color: #991b1b; background: #fee2e2; }
        .muted { color: #64748b; padding: 20px; }
        @media (max-width: 600px) {
            header { padding: 20px; }
            .panel-heading { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<header>
    <h1>Report Delivery Reliability</h1>
    <p>Scheduled statement outcomes and retry recommendations</p>
</header>
<main>
    <div id="error" class="error" hidden></div>
    <section id="summary" class="cards" aria-label="Run summary"></section>
    <section class="panel">
        <div class="panel-heading">
            <div>
                <h2>Runs that never succeeded</h2>
                <p>Failures are grouped by logical run; completed retries count as success.</p>
            </div>
            <button id="toggle" type="button">Show all runs</button>
        </div>
        <div id="runs" class="table-wrap"><p class="muted">Loading report history…</p></div>
    </section>
</main>
<script>
    const summaryRoot = document.getElementById("summary");
    const runsRoot = document.getElementById("runs");
    const errorRoot = document.getElementById("error");
    const toggle = document.getElementById("toggle");
    let showAll = false;
    let allRuns = [];

    function renderSummary(summary) {
        const cards = [
            ["Logical runs", summary.totalRuns],
            ["Succeeded", summary.successfulRuns],
            ["Never succeeded", summary.neverSucceededRuns],
            ["Retry recommended", summary.retryRecommendedRuns],
            ["Unresolved", summary.unresolvedRuns],
            ["Manual review", summary.reviewRequiredRuns]
        ];
        summaryRoot.innerHTML = cards.map(([label, value]) =>
            `<article class="card"><span>${label}</span><strong>${value}</strong></article>`
        ).join("");
    }

    function renderRuns(runs) {
        if (!runs.length) {
            runsRoot.innerHTML = '<p class="muted">No report runs to display.</p>';
            return;
        }
        const rows = runs.map(run => `
            <tr>
                <td>${run.runId}</td>
                <td>${run.tenantName}</td>
                <td>${run.reportName}</td>
                <td>${run.attemptCount}</td>
                <td>${run.latestStatus} (#${run.latestAttemptNumber})</td>
                <td><span class="badge ${run.outcome}">${run.outcome.replaceAll("_", " ")}</span></td>
                <td class="reason">${run.reason}</td>
            </tr>`).join("");
        runsRoot.innerHTML = `<table>
            <thead><tr><th>Run</th><th>Tenant</th><th>Report</th><th>Attempts</th><th>Latest attempt</th><th>Assessment</th><th>Reason</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    async function loadDashboard() {
        try {
            const [summaryResponse, runsResponse] = await Promise.all([
                fetch("/api/summary"),
                fetch("/api/report-runs/never-succeeded")
            ]);
            if (!summaryResponse.ok || !runsResponse.ok) {
                throw new Error("The report service could not load the job history.");
            }
            renderSummary(await summaryResponse.json());
            allRuns = await runsResponse.json();
            renderRuns(allRuns);
        } catch (error) {
            errorRoot.textContent = error.message;
            errorRoot.hidden = false;
            runsRoot.innerHTML = "";
        }
    }

    toggle.addEventListener("click", async () => {
        showAll = !showAll;
        toggle.textContent = showAll ? "Show never-succeeded only" : "Show all runs";
        if (showAll) {
            try {
                const response = await fetch("/api/report-runs");
                if (!response.ok) throw new Error("Unable to load all report runs.");
                renderRuns(await response.json());
            } catch (error) {
                errorRoot.textContent = error.message;
                errorRoot.hidden = false;
            }
        } else {
            renderRuns(allRuns);
        }
    });

    loadDashboard();
</script>
</body>
</html>
